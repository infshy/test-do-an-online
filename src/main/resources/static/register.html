<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Campus Food Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50 flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-orange-100">
        <h2 class="text-2xl font-bold text-center text-orange-600 mb-6">Tạo Tài Khoản Mới</h2>
        <form onsubmit="handleRegister(event)" class="space-y-3">
            <div>
                <label class="block text-sm font-medium mb-1">Họ và tên sinh viên</label>
                <input type="text" id="fullName" required placeholder="Nguyễn Văn A"
                    class="w-full p-3 border rounded-xl outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email trường (*@edu.vn, *@vju.ac.vn)</label>
                <input type="email" id="email" required placeholder="nva@vju.ac.vn"
                    class="w-full p-3 border rounded-xl outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Số điện thoại (9 chữ số)</label>
                <input type="tel" id="phone" pattern="[0-9]{10}" required placeholder="0987654321"
                    class="w-full p-3 border rounded-xl outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Mật khẩu (≥ 6 ký tự)</label>
                <input type="password" id="password" minlength="6" required placeholder="******"
                    class="w-full p-3 border rounded-xl outline-none">
            </div>
            <button type="submit"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition-colors mt-2">Đăng
                ký</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">Đã có tài khoản? <a href="/login.html"
                class="text-orange-600 font-semibold hover:underline">Đăng nhập</a></p>
    </div>
    <script src="/js/app.js"></script>
</body>

</html>
