<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Campus Food Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50 flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-orange-100">
        <h2 class="text-2xl font-bold text-center text-orange-600 mb-6">Đăng Nhập Sinh Viên</h2>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Email sinh viên (*@edu.vn, *@vju.ac.vn)</label>
                <input type="email" id="email" required placeholder="nva@vju.ac.vn"
                    class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-orange-200 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Mật khẩu</label>
                <input type="password" id="password" required placeholder="******"
                    class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-orange-200 outline-none">
            </div>
            <button type="submit"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition-colors">Đăng
                nhập</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">Chưa có tài khoản? <a href="/register.html"
                class="text-orange-600 font-semibold hover:underline">Đăng ký ngay</a></p>
    </div>
    <script src="/js/app.js"></script>
</body>

</html>
