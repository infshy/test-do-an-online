<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử đơn hàng - Campus Food Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-orange-50 font-sans text-gray-800 min-h-screen">

    <nav class="bg-white shadow-sm mb-8">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2 text-orange-600">
                <i data-lucide="utensils" class="w-7 h-7"></i>
                <span class="text-xl font-bold">Campus Food Express</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/index.html" class="text-gray-600 hover:text-orange-500 text-sm font-medium">← Quay lại
                    Menu</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4">
        <h1 class="text-2xl font-bold mb-6 flex items-center gap-2">
            <i data-lucide="clock" class="w-6 h-6 text-orange-500"></i> Lịch sử đơn hàng của bạn
        </h1>

        <div id="order-history-list" class="space-y-4">
            <!-- Dynamic Order Items -->
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadOrderHistory();
        });
    </script>
</body>

</html>
